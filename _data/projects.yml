- title: Failure-Guided Continuation Learning for Vision-Language-Action Policies
  title_zh: 面向视觉-语言-动作策略的失败诊断与针对性继续训练
  status: 研究项目 · 论文稿件
  image: /assets/images/projects/vla-main-task-success.png
  image_alt: LIBERO仿真环境中机器人完成主要操作任务的五个成功轨迹画面
  summary: >-
    面向VLA机器人策略在多步骤操作中的执行失败，研究如何将阶段化失败诊断转化为继续训练的数据分配信号。项目在LIBERO仿真环境中开展，覆盖π0与SmolVLA相关训练和评估流程，并通过受控对照区分针对性诊断与一般重采样的影响。
  contributions:
    - 构建阶段化失败分析与专家示范窗口重加权流程。
    - 搭建VLA继续训练、共享场景评估和受控对照实验。
    - 建立实际抽样、来源模型、检查点和逐回合结果的追溯记录。
  tags:
    - Vision-Language-Action
    - Robot Learning
    - LIBERO
    - π0 / SmolVLA
    - Python
    - Experimental Design

- title: "DPTC: Adaptive Compute Allocation for Visual World-Model Control"
  title_zh: 视觉世界模型控制中的自适应规划计算研究
  status: Research Project
  image: /assets/images/projects/dptc-research-prototype.png
  image_alt: DPTC自适应规划预算、世界模型规划器、机器人执行与受控评价流程图
  summary: >-
    研究视觉世界模型控制中的计算预算分配问题，探索如何在闭环执行中减少不必要的规划开销，同时保持对任务状态变化的响应能力。
  contributions:
    - 集成冻结视觉世界模型、MuJoCo机械臂环境与CEM/MPC规划器，构建覆盖规划、执行、轨迹记录和闭环评价的实验系统。
    - 实现多种计算预算策略及受控配对评价工具，用于比较规划成本、行为差异与任务表现。
    - 在64场开发实验中观察到规划器推理时间降低54.4%、候选模型预测工作量降低73.3%，并通过逐场分析界定结果的适用范围。
  tags:
    - Python
    - PyTorch
    - MuJoCo
    - Visual World Models
    - CEM
    - MPC
