- title: Failure-Guided Continuation Learning for Vision-Language-Action Policies
  title_zh: 面向视觉-语言-动作策略的失败诊断与针对性继续训练
  status: 研究项目 · 论文稿件
  summary: >-
    面向VLA机器人策略在多步骤操作中的执行失败，研究如何将阶段化失败诊断转化为继续训练的数据分配信号。项目在LIBERO仿真环境中开展，覆盖π0与SmolVLA相关训练和评估流程，并通过受控对照区分针对性诊断与一般重采样的影响。
  contributions:
    - 构建阶段化失败分析与专家示范窗口重加权流程。
    - 搭建VLA继续训练、共享场景评估和受控对照实验。
    - 建立实际抽样、来源模型、检查点和逐回合结果的追溯记录。
  tags:
    - Vision-Language-Action
    - Robot Learning
    - LIBERO
    - π0 / SmolVLA
    - Python
    - Experimental Design

- title: "DPTC: Adaptive Planning-Budget Allocation for Visual World-Model Control"
  title_zh: 面向视觉世界模型控制的自适应规划预算分配
  status: Research Project
  summary: >-
    研究视觉世界模型控制中的自适应规划计算分配，根据执行状态在复用缓存计划与调用CEM/MPC完整重规划之间进行选择，以减少不必要的模型预测和规划开销。
  contributions:
    - 设计执行1、3或5步缓存动作后重新决策的规划策略，分析计算成本、纠错频率与闭环成功率之间的权衡。
    - 构建同场景成对评估与同状态反事实分支实验，从一致的MuJoCo状态比较不同规划决策。
    - 在64场开发实验中保持35/64总体成功数，同时将规划推理时间降低54.4%，世界模型预测工作量降低73.3%。
  tags:
    - Python
    - PyTorch
    - MuJoCo
    - World Models
    - CEM
    - MPC
