  <p>
    东北大学机器人科学与工程学院机器人工程专业学生，研究兴趣集中于机器人学习、视觉语言动作模型与计算机视觉。
  </p>
  <p>
    当前工作聚焦于利用执行失败信息改进VLA策略的继续训练，并在仿真操作任务中开展失败诊断、受控对照与可追溯评估；另有基于YOLO的目标检测实践。
  </p>
  <p>
    主要使用Python与PyTorch进行数据处理、模型训练和实验分析，并具备C++编程基础。
