    现阶段的研究实践围绕VLA策略的继续训练、失败分析与仿真评估展开，注重受控实验、训练过程追溯和结论边界。同时开展过基于YOLO的目标检测实践。
  </p>
  <p>
    我主要使用Python进行数据处理、模型训练和实验分析，具备C++编程基础，并有PyTorch相关实践经验。目前仍在持续提升模型实现和工程调试能力。
  </p>

