  <p>
    我目前就读于东北大学机器人科学与工程学院机器人工程专业，关注机器人学习、视觉语言动作模型与计算机视觉，希望将模型训练、仿真评估和可核验的实验设计结合起来。
  </p>
  <p>
    我的研究实践包括VLA策略继续训练与失败分析，也做过基于YOLO的目标检测相关实践，并学习和使用过神经网络与PyTorch完成模型训练、数据处理和实验验证。
  </p>
  <p>
    我具备Python和C++编程基础，目前主要使用Python开展实验；对PyTorch已有实际使用经验，并在持续提高工程实现与训练调试能力。
  </p>

